name: Bug Report
description: Create a report to help us improve Omarchy
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! We really appreciate your help making Omarchy better.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide clear, reproducible steps to trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Omarchy version, browser, OS, etc.
      placeholder: e.g. Omarchy 4.0.1, Firefox 120, Arch Linux
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here (screenshots, logs, etc.).
    validations:
      required: false
