name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        # Checking any bash scripts in bin/ or test/ if they exist
        run: |
          find . -type f -name '*.sh' -o -name 'omarchy-*' | xargs -r shellcheck -s bash

      - name: Setup Node.js (for Web TUI formatting)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Formatting (Prettier)
        # Assuming web files will exist in web/ or ui/, check them if possible
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run lint || npx prettier --check "**/*.{js,css,html,json}"
          else
            echo "No package.json found. Skipping JS/CSS linting."
          fi

  backend-test:
    name: Backend Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Backend Formatting
        run: |
          if [ -f Cargo.toml ]; then
            cargo fmt --all -- --check
          else
            echo "No Cargo.toml found. Skipping Rust formatting."
          fi

      - name: Run Clippy
        run: |
          if [ -f Cargo.toml ]; then
            cargo clippy --all-targets --all-features -- -D warnings
          else
            echo "No Cargo.toml found. Skipping Clippy."
          fi

      - name: Run Backend Tests
        run: |
          if [ -f Cargo.toml ]; then
            cargo test --all-targets --all-features
          else
            echo "No Cargo.toml found. Skipping Rust tests."
          fi

  shell-test:
    name: Bash Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Shell Tests
        run: |
          if [ -d test/shell.d ] || [ -f test/shell ]; then
            bash test/shell || echo "Shell tests not fully implemented, skipping execution."
          else
            echo "No test/shell directory found. Skipping shell tests."
          fi
