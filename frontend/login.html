<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omarchy Web Management - Login</title>
  <link rel="stylesheet" href="/src/styles/theme.css">
  <link rel="stylesheet" href="/src/styles/tui.css">
  <link rel="stylesheet" href="/src/styles/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <header class="login-header">
        <div class="login-logo">
          <span class="logo-icon">◈</span>
          <span class="logo-text">OMARCHY</span>
        </div>
        <h1 class="login-title">Web Management</h1>
        <p class="login-subtitle">System Administration Interface</p>
      </header>

      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            autocomplete="username"
            required
            autofocus
            aria-describedby="username-error"
          >
          <span class="form-error" id="username-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              autocomplete="current-password"
              required
              aria-describedby="password-error"
            >
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
              <span class="toggle-icon" aria-hidden="true">▾</span>
            </button>
          </div>
          <span class="form-error" id="password-error" aria-live="polite"></span>
        </div>

        <div class="form-options">
          <label class="checkbox-wrapper">
            <input type="checkbox" id="remember" name="remember">
            <span class="checkmark"></span>
            Remember me
          </label>
        </div>

        <button type="submit" class="login-submit" id="login-submit">
          <span class="btn-text">Unlock</span>
          <span class="btn-loader" hidden>⟳</span>
        </button>

        <div class="form-message" id="form-message" aria-live="assertive" hidden></div>
      </form>

      <footer class="login-footer">
        <p class="version-info">web-omarchy v0.1.0</p>
        <p class="keyboard-hint">
          <kbd>Enter</kbd> to unlock · <kbd>Tab</kbd> to navigate
        </p>
      </footer>
    </div>

    <div class="login-background">
      <div class="bg-pattern"></div>
    </div>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
