[package]
name = "web_omarchy_daemon"
version = "0.1.0"
edition = "2021"
description = "Omarchy Web Management Interface - Backend Daemon"
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tungstenite = { version = "0.22", features = ["native-tls"] }
tokio-tungstenite = { version = "0.22", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
nix = "0.28"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
tower = "0.4"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.4"

[[bin]]
name = "web_omarchy_daemon"
path = "src/main.rs"